<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ed">
<meta name="description" content="时刻 x 归时谷 — C0 比赛体验。把现实里的事，带进一个会回应你的世界。">
<link rel="icon" href="data:,">
<title>时刻 x 归时谷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ed;--bg-elev:#fdfaf5;--bg-soft:#efe9df;
  --ink:#2c2520;--ink-soft:#6b5f54;--ink-mute:#9a8e82;--ink-line:#e0d8cb;
  --accent:#b8553f;--accent-soft:#d89682;--accent-bg:rgba(184,85,63,.08);
  --radius:14px;--radius-lg:20px;--radius-sm:10px;
  --font-serif:"Noto Serif SC",Georgia,"Songti SC",serif;
  --font-sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --shadow:0 1px 3px rgba(44,37,32,.06),0 12px 34px rgba(44,37,32,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-sans);
  background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;min-height:100vh;min-height:100dvh;
  background-image:radial-gradient(circle at 15% 0%,rgba(184,85,63,.06),transparent 40%),radial-gradient(circle at 90% 18%,rgba(138,122,106,.07),transparent 45%);
}
.wrap{
  width:100%;max-width:480px;margin:0 auto;
  padding:calc(20px + var(--safe-top)) 22px calc(40px + var(--safe-bottom));
}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;}
.wordmark{font-family:var(--font-serif);font-size:18px;font-weight:600;letter-spacing:.1em;color:var(--ink);}
.back-link{font-size:13px;color:var(--ink-mute);}
.badge{display:none;align-items:center;gap:6px;align-self:flex-start;font-size:12px;color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-soft);padding:5px 12px;border-radius:999px;margin-bottom:14px;}
.badge.show{display:inline-flex;}
.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
.hero{display:flex;flex-direction:column;}
.hero h1{font-family:var(--font-serif);font-size:34px;font-weight:600;letter-spacing:.04em;margin:0 0 14px;line-height:1.2;}
.hero h1 .x{color:var(--accent-soft);margin:0 4px;font-weight:400;}
.main-copy{font-family:var(--font-serif);font-size:18px;font-weight:500;line-height:1.7;color:var(--ink);margin:0 0 12px;}
.sub-copy{font-size:14px;line-height:1.75;color:var(--ink-soft);margin:0 0 28px;}
.steps{display:flex;flex-direction:column;gap:12px;margin-bottom:28px;}
.step{display:flex;gap:14px;align-items:flex-start;background:var(--bg-elev);border:1px solid var(--ink-line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.step-no{font-family:var(--font-serif);font-size:15px;font-weight:600;color:var(--accent);min-width:26px;}
.step-body strong{display:block;font-size:15px;font-weight:600;margin-bottom:2px;}
.step-body span{font-size:13px;color:var(--ink-mute);line-height:1.5;}
.section-label{font-size:12px;letter-spacing:.12em;color:var(--ink-mute);margin:0 2px 10px;}
.preview{background:var(--bg-elev);border:1px solid var(--ink-line);border-radius:var(--radius);padding:6px 4px;margin-bottom:26px;box-shadow:var(--shadow);}
.preview-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--ink-line);}
.preview-item:last-child{border-bottom:none;}
.preview-glyph{width:5px;height:38px;border-radius:999px;display:block;flex-shrink:0;}
.preview-glyph.task{background:#bd5943;}
.preview-glyph.commit{background:#d6a257;}
.preview-glyph.wait{background:#78afbd;}
.preview-text{flex:1;min-width:0;}
.preview-text .t{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.preview-text .k{font-size:11px;color:var(--ink-mute);}
.actions{display:flex;flex-direction:column;gap:12px;margin-bottom:14px;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;border:none;transition:transform .12s,box-shadow .2s,opacity .2s;font-family:inherit;}
.btn:active{transform:scale(.985);}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(184,85,63,.22);}
.btn-secondary{background:var(--bg-elev);color:var(--accent);border:1.5px solid var(--accent);}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--ink-line);min-height:44px;font-size:14px;font-weight:500;}
.demo-zone{margin-top:20px;padding-top:20px;border-top:1px dashed var(--ink-line);}
.demo-zone .actions{margin-bottom:0;}
.return-card{display:none;background:linear-gradient(135deg,#fff5ef,var(--bg-elev));border:1.5px solid var(--accent-soft);border-radius:var(--radius-lg);padding:20px;margin-bottom:24px;animation:fadeUp .35s forwards;box-shadow:0 18px 46px rgba(184,85,63,.1);}
.return-card.show{display:block;}
.return-card h3{font-family:var(--font-serif);font-size:17px;margin:0 0 4px;color:var(--accent);}
.return-card .meta{font-size:12px;color:var(--ink-mute);margin-bottom:12px;}
.return-list{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:8px;}
.return-list li{font-size:13px;background:rgba(255,255,255,.5);border:1px solid var(--ink-line);border-radius:var(--radius-sm);padding:9px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;}
.return-list li .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
.return-list li .act{color:var(--accent);font-weight:600;white-space:nowrap;}
.return-summary{font-size:13px;color:var(--ink-soft);margin:0 0 14px;line-height:1.6;}
.toast{position:fixed;left:50%;bottom:calc(28px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:100;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.foot{margin-top:28px;font-size:12px;color:var(--ink-mute);text-align:center;line-height:1.6;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.fade-in{opacity:0;animation:fadeUp .38s forwards;}
.fade-in.d1{animation-delay:.03s;}.fade-in.d2{animation-delay:.06s;}.fade-in.d3{animation-delay:.09s;}.fade-in.d4{animation-delay:.12s;}.fade-in.d5{animation-delay:.15s;}
.hero-visual{margin:18px 0 26px;border-radius:20px;overflow:hidden;position:relative;aspect-ratio:16/9;border:1px solid rgba(44,37,32,.12);box-shadow:0 22px 56px rgba(44,37,32,.16);background:#132039;}
.hero-visual img{width:100%;height:100%;display:block;object-fit:cover;}
.hero-visual figcaption{position:absolute;left:14px;bottom:12px;color:#fff;font-size:11px;letter-spacing:.08em;background:rgba(7,15,27,.6);backdrop-filter:blur(10px);padding:6px 9px;border-radius:999px;}
/* C1.2: Compact two-column layout for 1366x768 and similar short viewports */
@media (min-width:900px) and (max-height:850px){
  .wrap{
    max-width:1120px;max-height:calc(100vh - 32px);
    padding:16px 32px;display:flex;flex-direction:column;
    justify-content:center;overflow:hidden;box-sizing:border-box;
  }
  .topbar{margin-bottom:10px;}
  .badge{margin-bottom:6px;}
  .hero{flex-direction:row;gap:32px;align-items:stretch;flex:1;min-height:0;}
  .hero-left{flex:0 0 42%;display:flex;flex-direction:column;}
  .hero-right{flex:0 0 56%;display:flex;flex-direction:column;}
  .hero h1{font-size:26px;margin-bottom:6px;line-height:1.25;}
  .main-copy{font-size:15px;margin-bottom:6px;line-height:1.6;}
  .sub-copy{font-size:12px;margin-bottom:8px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .hero-time{margin:-4px 0 12px !important;}
  .steps{display:none;}
  #returnCard{margin-bottom:10px;padding:14px;}
  .section-label{margin-bottom:6px;}
  .preview{margin-bottom:0;padding:4px;flex:1;}
  .preview-item{padding:8px 12px;}
  .demo-zone{margin-top:10px;padding-top:10px;flex-shrink:0;}
  .btn{min-height:50px;font-size:14px;}
  .foot{margin-top:10px;font-size:11px;}
}
/* C1.2: Ultra-compact for 1280x720 */
@media (min-width:900px) and (max-height:740px){
  .hero h1{font-size:22px;margin-bottom:4px;}
  .main-copy{font-size:13px;margin-bottom:4px;}
  .sub-copy{font-size:11px;margin-bottom:6px;}
  .hero-time{font-size:11px !important;margin:-2px 0 8px !important;}
  .preview-item{padding:6px 10px;}
  .preview-glyph{width:28px;height:28px;font-size:15px;}
  .preview-text .t{font-size:12px;}
  .preview-text .k{font-size:10px;}
  .btn{min-height:46px;font-size:13px;}
  .topbar{margin-bottom:6px;}
  .wordmark{font-size:16px;}
  .back-link{font-size:12px;}
  .foot{margin-top:6px;font-size:10px;}
}
@media (max-width:360px){.hero h1{font-size:30px;}.main-copy{font-size:17px;}.wrap{padding-left:18px;padding-right:18px;}}
@media (min-width:900px) and (min-height:851px){
  .wrap{max-width:1120px;padding:30px 34px 60px;}
  .topbar{margin-bottom:34px;}
  .hero{display:grid;grid-template-columns:minmax(0,.95fr) minmax(400px,1.05fr);gap:54px;align-items:start;}
  .hero h1{font-size:46px;}
  .hero-visual{margin:26px 0 0;aspect-ratio:16/10;}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:38px;}
  .demo-zone{max-width:520px;margin:26px auto 0;}
}
@media (min-width:900px) and (max-height:850px){.hero-visual{display:none;}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.fade-in{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar fade-in">
    <a class="wordmark" href="showcase.html">时刻</a>
    <a class="back-link" href="showcase.html">返回官网 ›</a>
  </div>

      <span class="badge show" id="demoBadge"><span class="dot"></span><span id="modeLabel">正在读取真实事项</span></span>

  <section class="hero">
    <div class="hero-left">
      <h1 class="fade-in d1">时刻<span class="x">×</span>归时谷</h1>
      <p class="main-copy fade-in d2">把现实里的事，带进一个会回应你的世界。</p>
      <p class="sub-copy fade-in d3">在「时刻」记录事项，进入「归时谷」看见它们化作木牌、誓约灯与纸舟，再通过延期、拆分、放下或完成，让世界产生变化。</p>
      <p class="fade-in d3 hero-time" style="font-size:12px;color:var(--ink-mute);margin:-12px 0 20px;">预计体验时间：约2分钟 · 无需注册，演示数据不会覆盖个人记录</p>
      <figure class="hero-visual fade-in d4">
<img src="assets/chronos/chronos-valley-hero-v1.webp" alt="蓝色山谷中的木牌、誓约灯和纸舟顺着发光的溪流通向营火">
        <figcaption>现实事项，在山谷里获得新的位置</figcaption>
      </figure>
    </div>
    <div class="hero-right">
      <div id="returnCard" class="return-card"></div>
      <p class="section-label">将带入归时谷的事项</p>
      <div class="preview" id="preview"></div>
    </div>
  </section>

  <div class="steps">
    <div class="step fade-in d3"><div class="step-no">01</div><div class="step-body"><strong>记录现实事项</strong><span>在「时刻」写下要做的事、答应的话、等待的结果。</span></div></div>
    <div class="step fade-in d4"><div class="step-no">02</div><div class="step-body"><strong>在归时谷重新处理</strong><span>事项化作木牌、誓约灯与纸舟，出现在山谷里。</span></div></div>
    <div class="step fade-in d5"><div class="step-no">03</div><div class="step-body"><strong>把选择带回现实</strong><span>延期、拆分、放下或完成，让世界产生变化。</span></div></div>
  </div>

  <div class="demo-zone">
    <div class="actions">
      <button class="btn btn-primary" id="demoExpBtn">开始体验</button>
    </div>
    <details style="margin-top:8px;">
      <summary style="font-size:12px;color:var(--ink-mute);cursor:pointer;list-style:none;text-align:center;padding:4px;">更多选项</summary>
      <div class="actions" style="margin-top:8px;">
        <button class="btn btn-ghost" id="restartDemoBtn">重新开始演示</button>
        <button class="btn btn-ghost" id="exitDemoBtn">退出演示模式</button>
      </div>
    </details>
  </div>

  <p class="foot">C1 比赛体验 · 数据通过本地 localStorage 传递，不会离开你的设备。</p>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import {
  clearReturnPayload,
  detectGameType,
  generateHandoff,
  getDemoRecords,
  goToGame,
  isReturnApplied,
  markReturnApplied,
  readReturnPayload,
  writeHandoff
} from './src/bridge/web-bridge.js';

var RETURN_URL = '../competition.html';
var activeRecords = [];
var isDemoMode = false;

var TYPE_META = {
  TASK:        { glyph: '', label: '木牌 · 任务',  cls: 'task' },
  COMMITMENT:  { glyph: '', label: '誓约灯 · 承诺', cls: 'commit' },
  WAITING_FOR: { glyph: '', label: '纸舟 · 等待',  cls: 'wait' }
};

var ACTION_LABELS = {
  extend:'延期', postpone:'延期', delay:'延期', deferred:'延期',
  split:'拆分', break_down:'拆分',
  drop:'放下', let_go:'放下', release:'放下', released:'放下', abandon:'放下',
  complete:'完成', done:'完成', finish:'完成', resolve:'完成', completed:'完成',
  keep:'保留', hold:'保留', seen:'已见到', acknowledged:'已安放',
  dropToday:'今天不处理', droptoday:'今天不处理'
};

function $(id){ return document.getElementById(id); }

function showToast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

function readRealRecords(){
  try{
    var raw = localStorage.getItem('shike_records_v1');
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}

function renderPreview(records){
  var list = (records && records.length) ? records.slice(0,3) : [];
  var el = $('preview');
  el.innerHTML = '';
  if(!list.length){
    var empty = document.createElement('div');
    empty.className = 'preview-item';
    empty.innerHTML = '<div class="preview-text"><div class="t">还没有真实事项</div><div class="k">先回到“时刻”写下一件需要处理的事</div></div>';
    el.appendChild(empty);
    return;
  }
  list.forEach(function(r){
    var gt = detectGameType(r);
    var meta = TYPE_META[gt] || TYPE_META.TASK;
    var title = r.title || r.text || '未命名事项';
    var row = document.createElement('div');
    row.className = 'preview-item';
    var g = document.createElement('div');
    g.className = 'preview-glyph ' + meta.cls;
    g.setAttribute('aria-hidden', 'true');
    var tx = document.createElement('div');
    tx.className = 'preview-text';
    var t = document.createElement('div'); t.className = 't'; t.textContent = title;
    var k = document.createElement('div'); k.className = 'k'; k.textContent = meta.label;
    tx.appendChild(t); tx.appendChild(k);
    row.appendChild(g); row.appendChild(tx);
    el.appendChild(row);
  });
}

function launch(records){
  var handoff = generateHandoff(records, { returnUrl: RETURN_URL });
  if(!writeHandoff(handoff)){
    showToast('无法写入交接数据，请检查存储权限');
    return;
  }
  goToGame('valley/');
}

$('demoExpBtn').addEventListener('click', function(){
  if(activeRecords.length){ launch(activeRecords); return; }
  showToast('先在“时刻”记录至少一件事项');
  setTimeout(function(){ location.href = 'index.html?capture=1'; }, 700);
});
$('restartDemoBtn').addEventListener('click', function(){
  clearReturnPayload();
  location.reload();
});
$('exitDemoBtn').addEventListener('click', function(){
  clearReturnPayload();
  location.href = 'index.html';
});

function renderReturnCard(){
  var data = readReturnPayload();
  var card = $('returnCard');
  if(!data){ card.classList.remove('show'); card.innerHTML = ''; return; }
  var applied = isReturnApplied(data.transferId);
  card.innerHTML = '';
  var results = data.actions || data.results || data.records || [];
  var resultCount = Array.isArray(results) ? results.length : 0;
  var h = document.createElement('h3'); h.textContent = resultCount + ' 个结果，已经从山谷返回'; card.appendChild(h);
  var meta = document.createElement('div'); meta.className = 'meta';
  meta.textContent = '交接号 ' + String(data.transferId).slice(0,18) + (applied ? ' · 已应用' : '');
  card.appendChild(meta);
  if(Array.isArray(results) && results.length){
    var ul = document.createElement('ul'); ul.className = 'return-list';
    results.forEach(function(it){
      var li = document.createElement('li');
      var name = document.createElement('span'); name.className = 'name';
      var act = it.action || it.outcome || '';
      var label = ACTION_LABELS[String(act).toLowerCase()] || act || '处理';
      // For split actions, show detailed before/after
      if(act === 'split' && it.children && it.children.length){
        name.textContent = it.summary || it.title || '事项';
        var actSpan = document.createElement('span'); actSpan.className = 'act'; actSpan.textContent = '已拆分';
        li.appendChild(name); li.appendChild(actSpan); ul.appendChild(li);
        // Show children steps
        it.children.forEach(function(child, idx){
          var cli = document.createElement('li');
          var cname = document.createElement('span'); cname.className = 'name';
          cname.textContent = (idx+1) + ' ' + child;
          var cact = document.createElement('span'); cact.className = 'act';
          cact.style.color = '#fbbf24'; cact.textContent = '子步骤';
          cli.appendChild(cname); cli.appendChild(cact); ul.appendChild(cli);
        });
      } else {
        name.textContent = it.summary || it.title || it.sourceRecordId || '事项';
        var actSpan2 = document.createElement('span'); actSpan2.className = 'act'; actSpan2.textContent = label;
        li.appendChild(name); li.appendChild(actSpan2); ul.appendChild(li);
      }
    });
    card.appendChild(ul);
  }else{
    var p = document.createElement('p'); p.className = 'return-summary';
    p.textContent = data.summary || '归时谷已记录你在山谷里做出的选择。';
    card.appendChild(p);
  }
  // World result
  var worldDiv = document.createElement('div');
  worldDiv.style.cssText = 'font-size:12px;color:var(--ink-mute);padding:10px 12px;background:rgba(184,85,63,.05);border-radius:10px;margin-bottom:14px;line-height:1.6;';
  worldDiv.textContent = resultCount
    ? '归时谷已带回 ' + resultCount + ' 个本地处理结果，等待你应用到时刻。'
    : '归时谷已返回，当前没有可应用的事项变化。';
  card.appendChild(worldDiv);
  // Buttons
  var btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:8px;';
  var btn = document.createElement('button');
  btn.className = 'btn ' + (applied ? 'btn-ghost' : 'btn-secondary');
  btn.style.cssText = 'flex:1;min-height:44px;';
  btn.textContent = applied ? '已应用' : (isDemoMode ? '确认演示结果' : '应用并返回时刻');
  btn.addEventListener('click', function(){
    if(!applied && isDemoMode){
      markReturnApplied(data.transferId);
    }
    if(!applied && !isDemoMode){
      showToast('正在安全写回你的真实事项');
      location.href = 'index.html?chronosReturn=1';
      return;
    }
    clearReturnPayload();
    card.classList.remove('show'); card.innerHTML = '';
    showToast(applied ? '已清除回响' : '演示结果已确认');
    var fresh = readRealRecords();
    renderPreview(fresh.length ? fresh : null);
  });
  btnRow.appendChild(btn);
  if(!applied){
    var btn2 = document.createElement('button');
    btn2.className = 'btn btn-ghost';
    btn2.style.cssText = 'flex:1;min-height:44px;font-size:13px;';
    btn2.textContent = '再次进入归时谷';
    btn2.addEventListener('click', function(){
      var next = isDemoMode ? getDemoRecords() : readRealRecords();
      if(next.length) launch(next);
      else location.href = 'index.html?capture=1';
    });
    btnRow.appendChild(btn2);
  }
  card.appendChild(btnRow);
  card.classList.add('show');
}

(function init(){
  var params = new URLSearchParams(location.search);
  isDemoMode = params.get('demo') === 'competition';
  var initRecords = readRealRecords();
  activeRecords = isDemoMode ? getDemoRecords() : initRecords.slice(0,3);
  $('modeLabel').textContent = isDemoMode ? '演示模式' : (activeRecords.length ? '真实使用 · 本机事项' : '等待真实事项');
  $('demoExpBtn').textContent = isDemoMode
    ? '开始演示体验'
    : (activeRecords.length ? '带着我的 ' + activeRecords.length + ' 件事项进入归时谷' : '先去时刻记录事项');
  $('exitDemoBtn').textContent = isDemoMode ? '退出演示模式' : '返回时刻';
  renderPreview(activeRecords);
  renderReturnCard();
})();
</script>
</body>
</html>
